name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 記事の書式を先に検証する。Astro のスキーマエラーは原因ファイルが
      # 分かりにくく、他サイトの記事の誤混入などで復旧が遅れた経緯があるため、
      # 依存インストール前に明示的なメッセージで落とす（数秒で失敗が分かる）。
      - name: Validate content
        run: node scripts/validate-content.mjs

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 記事の書式を先に検証する。Astro のスキーマエラーは原因ファイルが
      # 分かりにくく、他サイトの記事の誤混入などで復旧が遅れた経緯があるため、
      # 依存インストール前にチェックする。
      # Hugo（浦安ぽーたる）記事の混入は、その1本だけワークスペースから隔離して
      # ::warning:: とジョブサマリーで知らせ、残りのデプロイは続行する
      # （2026-08〜09 に混入3回、そのたびに全体停止していたための措置）。
      # 本サイト記事自体の書式エラーは従来どおりビルドを止める。
      - name: Validate content
        run: node scripts/validate-content.mjs

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
